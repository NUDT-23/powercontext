app:
  description: 记性完美的酒馆老板NPC——你说过的话他全记得，隔天再开新会话他照样记得你，当场拆穿你的前后矛盾。记忆由 PowerContext 服务持久化。
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: 老板记性太好酒馆
  use_icon_as_answer_icon: true
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai_api_compatible:0.0.73@4cf123ffaa4556f079bed6c47f3a462cc825504b859b183239e74eb19136a4b5
    version: null
kind: app
version: 0.5.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: ''
    id: 6e51d428-3b0c-439a-a525-d5766fac02f2
    name: PC_URL
    selector:
    - env
    - PC_URL
    value: http://your-powercontext-host:8000
    value_type: string
  - description: ''
    id: f1df0ddc-f4a1-4bf2-978e-04790f76514d
    name: TAVERN_SCOPE
    selector:
    - env
    - TAVERN_SCOPE
    value: scp_REPLACE_WITH_TAVERN_SCOPE_ID
    value_type: string
  features:
    file_upload:
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_upload
        - remote_url
    opening_statement: '欢迎来到「老板记性太好酒馆」🍻

      我就是老板。先报名字，然后随便聊——你说过的话，我可都记着。'
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: http-request
      id: edge-start-search
      source: node_start
      sourceHandle: source
      target: node_search
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: http-request
        targetType: llm
      id: edge-search-llm
      source: node_search
      sourceHandle: source
      target: node_boss
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: answer
      id: edge-llm-answer
      source: node_boss
      sourceHandle: source
      target: node_answer
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: answer
        targetType: http-request
      id: edge-answer-remember
      source: node_answer
      sourceHandle: source
      target: node_remember
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 开局登记玩家名（跨会话记忆的钥匙）
        selected: false
        title: 开局登记
        type: start
        variables:
        - label: 你叫什么名字
          max_length: 48
          options: []
          required: true
          type: text-input
          variable: player_key
      height: 106
      id: node_start
      position:
        x: 60
        y: 280
      positionAbsolute:
        x: 60
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data: "{\n  \"scope_id\": \"{{#env.TAVERN_SCOPE#}}\",\n  \"query\": \"{{#node_start.player_key#}}\
            \ {{#sys.query#}}\",\n  \"limit\": 8\n}"
          type: json
        desc: 从 PowerContext 召回和这句话相关的历史记忆
        headers: Content-Type:application/json
        method: post
        params: ''
        retry_config:
          enabled: true
          exponential_backoff:
            enabled: true
            max_interval: 10000
            multiplier: 2
          max_retries: 2
          retry_interval: 1000
        selected: false
        timeout:
          connect: 10
          read: 15
          write: 15
        title: 老板回忆中
        type: http-request
        url: '{{#env.PC_URL#}}/v1/memory/search'
        variables: []
      height: 122
      id: node_search
      position:
        x: 380
        y: 280
      positionAbsolute:
        x: 380
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 酒馆老板人设，注入记忆
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 10
        model:
          completion_params:
            temperature: 0.8
          mode: chat
          name: MiniMax-M3.1-Flash
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: sys-prompt-tavern
          role: system
          text: '你是「老板记性太好酒馆」的老板，一个记性完美、嘴上不饶人但心肠热的老酒馆老板。


            【记忆库检索结果】（PowerContext 返回，可能为空）：

            {{#node_search.body#}}


            规则：

            1. 谈论玩家的过去时，只能依据上面检索结果里真实出现的内容。玩家没说过、检索里没有的事，就说"这你可没跟我说过"，绝不编造。

            2. 玩家的话与检索结果矛盾时，当场温和地拆穿，并引用他原来说过的话。

            3. 新玩家（检索为空）就热情寒暄，自我介绍记性好，让他随便聊。

            4. 保持老板口吻：简短、风趣、带点酒馆烟火气，每次回复一般不超过三句话。不要提"系统""数据库""API"这些词。'
        selected: false
        title: 老板
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: node_boss
      position:
        x: 700
        y: 280
      positionAbsolute:
        x: 700
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: '{{#node_boss.text#}}'
        desc: ''
        selected: false
        title: 直接回复
        type: answer
        variables: []
      height: 105
      id: node_answer
      position:
        x: 1020
        y: 280
      positionAbsolute:
        x: 1020
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data: "{\n  \"scope_id\": \"{{#env.TAVERN_SCOPE#}}\",\n  \"kind\": \"tavern-turn\"\
            ,\n  \"text\": \"玩家{{#node_start.player_key#}}说：{{#sys.query#}} || 老板回：{{#node_boss.text#}}\"\
            ,\n  \"reason\": \"tavern conversation turn\"\n}"
          type: json
        desc: 把本轮对话写入 PowerContext 长期记忆
        headers: Content-Type:application/json
        method: post
        params: ''
        retry_config:
          enabled: true
          exponential_backoff:
            enabled: true
            max_interval: 10000
            multiplier: 2
          max_retries: 2
          retry_interval: 1000
        selected: false
        timeout:
          connect: 10
          read: 15
          write: 15
        title: 老板记下了
        type: http-request
        url: '{{#env.PC_URL#}}/v1/memory/remember'
        variables: []
      height: 122
      id: node_remember
      position:
        x: 1340
        y: 280
      positionAbsolute:
        x: 1340
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.7
  rag_pipeline_variables: []
