# Attach PowerContext to an existing Dify deployment (Dify 1.17.1).
#
# Usage (run from the directory that contains Dify's docker-compose.yaml):
#   docker build -f /path/to/dify/grudge-tavern/compose/powercontext.Dockerfile \
#                -t powercontext:1.5.0 /path/to/dify/grudge-tavern/compose
#   docker compose -f docker-compose.yaml \
#                  -f /path/to/dify/grudge-tavern/compose/docker-compose.override.yaml up -d
#
# Because this file only references an image, it can be merged with any Dify
# compose project; no relative build paths are involved.
services:
  powercontext:
    image: powercontext:1.5.0
    restart: unless-stopped
    environment:
      POWERCONTEXT_SERVER_HTTP_HOST: 0.0.0.0
      POWERCONTEXT_SERVER_HTTP_PORT: "8000"
      POWERCONTEXT_SERVER_DASHBOARD_ENABLED: "true"
      # Demo mode: the service is reachable only from the compose network and
      # the optional host port below. See README for the enforced-auth variant.
      POWERCONTEXT_SERVER_ACCESS_MODE: disabled
      POWERCONTEXT_SERVER_ALLOW_UNAUTHENTICATED_NON_LOOPBACK: "true"
      POWERCONTEXT_HOME: /data
    volumes:
      - powercontext_data:/data
    ports:
      # Host-side access for scripts/02..05; the app itself uses
      # http://powercontext:8000 on the compose network.
      - "${POWERCONTEXT_HOST_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  powercontext_data:
