name: paperlens

services:
  powercontext:
    build:
      context: ./powercontext
    restart: unless-stopped
    environment:
      POWERCONTEXT_SERVER_HTTP_HOST: 0.0.0.0
      POWERCONTEXT_SERVER_HTTP_PORT: "8000"
      POWERCONTEXT_SERVER_DASHBOARD_ENABLED: "true"
      POWERCONTEXT_SERVER_ACCESS_MODE: disabled
      POWERCONTEXT_SERVER_ALLOW_UNAUTHENTICATED_NON_LOOPBACK: "true"
      POWERCONTEXT_HOME: /data
    volumes:
      - pc_data:/data
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      # Keep the ONNX embedding model cache inside the persistent data volume.
      HOME: /data
      POWERCONTEXT_URL: http://powercontext:8000
      APP_URL: http://127.0.0.1:8000
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    volumes:
      - app_data:/data
      - ./evidence:/app/evidence
      - ./seed:/app/seed
    ports:
      - "8080:8000"
    depends_on:
      powercontext:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  pc_data:
  app_data:
